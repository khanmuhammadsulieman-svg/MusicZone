<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUZiFY by sulieman khan</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Fixed Top Header & Navigation -->
  <header class="fixed-top-header" id="fixedTopHeader">
    <div class="top-row">
      <div class="brand-title-wrap">
        <i class="fa-brands fa-spotify brand-icon"></i>
        <span class="brand-name">MUZiFY</span>
      </div>

      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search songs, artists, playlists..." />
      </div>

      <div class="user-profile-badge">
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
        <span>Sulieman</span>
      </div>
    </div>

    <!-- Pinned Top Navigation Tabs (Home, Explore, Library) -->
    <nav class="top-nav-tabs" id="topNavTabs">
      <button class="top-nav-btn active nav-home-btn"><i class="fa-solid fa-house"></i> Home</button>
      <button class="top-nav-btn nav-explore-btn"><i class="fa-regular fa-compass"></i> Explore</button>
      <button class="top-nav-btn nav-library-btn"><i class="fa-solid fa-lines-leaning"></i> Library</button>
    </nav>

    <!-- Pinned Category Chips Row -->
    <div class="chips-row">
      <button class="chip active" data-tab="all">All</button>
      <button class="chip" data-tab="trending">Trending Now</button>
      <button class="chip" data-tab="latest">Latest Releases</button>
      <button class="chip" data-tab="artists">Artists</button>
    </div>
  </header>

  <!-- App Structure -->
  <div class="app-layout">
    <!-- Desktop Left Sidebar for Quick Playlists -->
    <aside class="sidebar">
      <div class="sidebar-section-title">QUICK PLAYLISTS</div>
      <div class="playlist-quick-list">
        <button class="playlist-btn" data-query="Top Global Hits 2026"><i class="fa-solid fa-fire"></i> Top Hits</button>
        <button class="playlist-btn" data-query="Coke Studio Pakistan"><i class="fa-solid fa-record-vinyl"></i> Coke Studio</button>
        <button class="playlist-btn" data-query="Punjabi Hits 2026"><i class="fa-solid fa-music"></i> Punjabi Hits</button>
        <button class="playlist-btn" data-query="Chill Lofi Beats"><i class="fa-solid fa-mug-saucer"></i> Lo-Fi Chill</button>
      </div>

      <div class="sidebar-footer">
        <span>Crafted by Sulieman Khan</span>
      </div>
    </aside>

    <!-- Scrollable Music Feed -->
    <main class="main-content" id="mainContent">
      <div class="content-feed" id="contentFeed"></div>
    </main>
  </div>

  <!-- Background Audio Anchor for Mobile Screen-Off / App-Switch Playback -->
  <audio id="bgAudioEngine" loop playsinline preload="auto" src="https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3"></audio>

  <!-- Bottom Mini Player Bar -->
  <footer class="player-bar" id="playerBar">
    <div class="player-left" id="footerTrackTrigger" title="Click to open Fullscreen Player">
      <div class="player-screen-wrap">
        <iframe 
          id="ytPlayerIframe" 
          src="" 
          allow="autoplay; encrypted-media; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="current-track-info">
        <div id="currentTrackTitle" class="track-title">Select a track</div>
        <div id="currentTrackArtist" class="track-artist">MUZiFY Player</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button id="shuffleBtn" class="control-btn-sub" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
        <button id="prevBtn" class="control-btn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn" class="control-btn-play" title="Play/Pause"><i class="fa-solid fa-pause"></i></button>
        <button id="nextBtn" class="control-btn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
        <button id="repeatBtn" class="control-btn-sub" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
      </div>

      <div class="progress-wrap">
        <span id="currentTime" class="time-label">0:00</span>
        <div class="progress-bar-bg" id="progressBar">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <span id="duration" class="time-label">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="like-btn" id="likeBtn"><i class="fa-regular fa-heart"></i></button>
      <i class="fa-solid fa-volume-high volume-icon"></i>
      <div class="volume-slider-wrap">
        <input type="range" id="volumeSlider" min="0" max="100" value="80" />
      </div>
    </div>
  </footer>

  <!-- Fullscreen Modal View -->
  <div class="fullscreen-player-modal" id="fullscreenModal">
    <div class="fs-backdrop-glow" id="fsBackdrop"></div>
    <div class="fs-top-bar">
      <button class="fs-close-btn" id="fsCloseBtn" title="Collapse"><i class="fa-solid fa-chevron-down"></i></button>
      <div class="fs-header-title">PLAYING FROM MUZiFY</div>
      <button class="fs-menu-btn"><i class="fa-solid fa-ellipsis"></i></button>
    </div>

    <div class="fs-scrollable-body">
      <div class="fs-center-content">
        <div class="fs-art-wrapper">
          <img id="fsTrackArt" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600" alt="Album Art" />
        </div>

        <div class="fs-meta-row">
          <div class="fs-info">
            <h1 id="fsTrackTitle">Song Title</h1>
            <p id="fsTrackArtist">Artist Name</p>
          </div>
          <button class="fs-like-btn" id="fsLikeBtn"><i class="fa-regular fa-heart"></i></button>
        </div>

        <div class="fs-progress-container">
          <div class="progress-bar-bg fs-progress-bg" id="fsProgressBar">
            <div class="progress-bar-fill" id="fsProgressFill" style="width: 0%;"></div>
          </div>
          <div class="fs-time-labels">
            <span id="fsCurrentTime">0:00</span>
            <span id="fsDuration">0:00</span>
          </div>
        </div>

        <div class="fs-controls-row">
          <button id="fsShuffleBtn" class="control-btn-sub"><i class="fa-solid fa-shuffle"></i></button>
          <button id="fsPrevBtn" class="control-btn fs-nav-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="fsPlayBtn" class="control-btn-play fs-play-main"><i class="fa-solid fa-pause"></i></button>
          <button id="fsNextBtn" class="control-btn fs-nav-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button id="fsRepeatBtn" class="control-btn-sub"><i class="fa-solid fa-repeat"></i></button>
        </div>
      </div>

      <div class="fs-queue-section">
        <div class="fs-queue-header">
          <span class="fs-queue-title">Up Next (Recommended)</span>
          <span class="fs-queue-sub" id="fsCategoryBadge">Related Songs</span>
        </div>
        <div class="fs-queue-list" id="fsQueueList">
          <div class="queue-loading">Finding matching songs...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
