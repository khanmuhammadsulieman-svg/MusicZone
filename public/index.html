<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="app-container">
    <!-- Sidebar / Library View -->
    <aside class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-compact-disc brand-icon"></i>
        <span>Aura</span>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search track or artist..." />
      </div>

      <div class="section-title">Search Results / Queue</div>
      <ul id="trackList" class="track-list">
        <!-- Dynamic Track Items -->
      </ul>
    </aside>

    <!-- Main Player Display -->
    <main class="player-panel">
      <div class="glass-card">
        <div class="album-art-wrapper">
          <img id="albumArt" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600" alt="Album Cover" />
        </div>

        <div class="track-info">
          <h2 id="trackTitle">No Track Selected</h2>
          <p id="artistName">Search or select a track to begin</p>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
          <span id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button id="prevBtn" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playBtn" class="control-btn play-btn"><i class="fa-solid fa-play"></i></button>
          <button id="nextBtn" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <!-- Volume Bar -->
        <div class="volume-container">
          <i class="fa-solid fa-volume-low"></i>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
          <i class="fa-solid fa-volume-high"></i>
        </div>
      </div>
    </main>
  </div>

  <audio id="audioSource"></audio>
  <script src="app.js"></script>
</body>
</html>
