<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUZiFY by sulieman khan</title>
  
  <!-- PWA Meta Tags & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MUZiFY" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png" />
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Desktop Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-brands fa-spotify brand-icon"></i>
        <span>MUZiFY</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item nav-home-btn active"><i class="fa-solid fa-house"></i> Home</button>
        <button class="nav-item nav-explore-btn"><i class="fa-solid fa-compass"></i> Explore</button>
        <button class="nav-item nav-library-btn"><i class="fa-solid fa-lines-leaning"></i> Library</button>
      </nav>

      <div class="sidebar-playlists">
        <div class="sidebar-section-title">QUICK PLAYLISTS</div>
        <button class="playlist-btn" data-query="Top Hits 2026"><i class="fa-solid fa-fire"></i> Top Hits</button>
        <button class="playlist-btn" data-query="Coke Studio Pakistan"><i class="fa-solid fa-record-vinyl"></i> Coke Studio</button>
        <button class="playlist-btn" data-query="Punjabi Hits 2026"><i class="fa-solid fa-music"></i> Punjabi Hits</button>
        <button class="playlist-btn" data-query="Chill Lofi Beats"><i class="fa-solid fa-mug-saucer"></i> Lo-Fi Chill</button>
      </div>

      <div class="sidebar-footer">
        Crafted by Sulieman Khan
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <!-- Fixed Clean Top Header (Search & Category Chips Only) -->
      <header class="fixed-top-header">
        <div class="top-row">
          <div class="mobile-brand">
            <i class="fa-brands fa-spotify"></i>
            <span>MUZiFY</span>
          </div>

          <div class="search-bar-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search songs, artists, playlists..." autocomplete="off" />
          </div>

          <div class="user-action-group">
            <button id="pwaInstallBtn" class="pwa-install-btn" style="display: none;">
              <i class="fa-solid fa-download"></i> Install
            </button>
            <div class="profile-pill">
              <i class="fa-solid fa-user"></i>
              <span>Sulieman</span>
            </div>
          </div>
        </div>

        <!-- Filter Chips Row -->
        <div class="filter-chips">
          <button class="chip active" data-tab="all">All</button>
          <button class="chip" data-tab="trending">Trending Now</button>
          <button class="chip" data-tab="latest">Latest Releases</button>
          <button class="chip" data-tab="artists">Artists</button>
        </div>
      </header>

      <!-- Scrollable Music Discovery Feed -->
      <div id="contentFeed" class="content-feed"></div>
    </main>
  </div>

  <!-- Hidden Embedded YouTube Audio Player -->
  <iframe id="ytPlayerIframe" allow="autoplay" style="display:none;" src=""></iframe>

  <!-- Persistent Floating Music Player Bar -->
  <footer id="footerPlayer" class="footer-player">
    <div class="footer-left" id="footerTrackTrigger">
      <div class="footer-art-wrap">
        <i class="fa-solid fa-music"></i>
      </div>
      <div class="footer-meta">
        <div class="footer-title" id="currentTrackTitle">Select a track</div>
        <div class="footer-artist" id="currentTrackArtist">MUZiFY Music</div>
      </div>
    </div>

    <div class="footer-center">
      <div class="footer-controls">
        <button class="icon-btn-secondary" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
        <button id="prevBtn" class="icon-btn-secondary" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn" class="icon-btn-play" title="Play/Pause"><i class="fa-solid fa-play"></i></button>
        <button id="nextBtn" class="icon-btn-secondary" title="Next"><i class="fa-solid fa-forward-step"></i></button>
        <button class="icon-btn-secondary" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
      </div>

      <div class="footer-progress">
        <span id="currentTime">0:00</span>
        <div class="progress-bar-track" id="progressBar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span id="duration">3:40</span>
      </div>
    </div>

    <div class="footer-right">
      <button class="icon-btn-secondary"><i class="fa-regular fa-heart"></i></button>
      <div class="volume-box">
        <i class="fa-solid fa-volume-high"></i>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" />
      </div>
    </div>
  </footer>

  <!-- Android Native Style Bottom Navigation Bar -->
  <nav class="android-bottom-bar" id="androidBottomBar">
    <button class="bottom-tab-item active nav-home-btn">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="bottom-tab-item nav-explore-btn">
      <i class="fa-solid fa-compass"></i>
      <span>Explore</span>
    </button>
    <button class="bottom-tab-item nav-search-btn" id="bottomNavSearch">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </button>
    <button class="bottom-tab-item nav-library-btn">
      <i class="fa-solid fa-lines-leaning"></i>
      <span>Library</span>
    </button>
  </nav>

  <!-- Fullscreen Modal Player & Recommendations -->
  <div id="fullscreenModal" class="fullscreen-modal">
    <div class="fs-header">
      <button id="fsCloseBtn" class="fs-close-btn"><i class="fa-solid fa-chevron-down"></i></button>
      <div class="fs-playing-from">PLAYING FROM MUZiFY</div>
      <button class="fs-menu-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>

    <div class="fs-content-wrap">
      <div class="fs-main-panel">
        <div class="fs-art-container">
          <img id="fsTrackArt" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600" alt="Album Art" />
        </div>

        <div class="fs-info-row">
          <div class="fs-meta">
            <h2 id="fsTrackTitle">Song Title</h2>
            <p id="fsTrackArtist">Artist Name</p>
          </div>
          <button class="fs-like-btn"><i class="fa-regular fa-heart"></i></button>
        </div>

        <div class="fs-progress-wrap">
          <div class="fs-progress-bar" id="fsProgressBar">
            <div class="fs-progress-fill" id="fsProgressFill"></div>
          </div>
          <div class="fs-time-labels">
            <span id="fsCurrentTime">0:00</span>
            <span id="fsDuration">3:40</span>
          </div>
        </div>

        <div class="fs-controls">
          <button class="icon-btn-secondary"><i class="fa-solid fa-shuffle"></i></button>
          <button id="fsPrevBtn" class="icon-btn-secondary"><i class="fa-solid fa-backward-step"></i></button>
          <button id="fsPlayBtn" class="icon-btn-play fs-play-main"><i class="fa-solid fa-play"></i></button>
          <button id="fsNextBtn" class="icon-btn-secondary"><i class="fa-solid fa-forward-step"></i></button>
          <button class="icon-btn-secondary"><i class="fa-solid fa-repeat"></i></button>
        </div>
      </div>

      <div class="fs-queue-panel">
        <div class="fs-queue-header">
          <h3>Up Next (Recommended)</h3>
          <span id="fsCategoryBadge" class="fs-badge">RELATED SONGS</span>
        </div>
        <div id="fsQueueList" class="fs-queue-list"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
